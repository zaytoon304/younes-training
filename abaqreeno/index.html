<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عبقرينو — لعبة الشبكة الذكية | جذور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Amiri:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/deck.css">
<link rel="stylesheet" href="widgetsA.css">
<style>
/* ── bar toggle ── */
#barToggle {
  position: fixed;
  bottom: 52px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  background: rgba(30,30,50,.75);
  border: 1px solid rgba(255,255,255,.18);
  backdrop-filter: blur(8px);
  color: #fff;
  font-size: 13px;
  font-family: Cairo, sans-serif;
  font-weight: 700;
  padding: 4px 16px 4px 12px;
  border-radius: 999px 999px 0 0;
  cursor: pointer;
  transition: opacity .2s;
  border-bottom: none;
  letter-spacing: .3px;
  line-height: 1.8;
}
#barToggle:hover { background: rgba(50,50,80,.9); }
body.bar-hidden #barToggle {
  bottom: 0;
  border-radius: 999px 999px 0 0;
}
body.bar-hidden #bar { transform: translateY(100%); }
#bar { transition: transform .25s ease; }
</style>
</head>
<body>
<div id="progress"></div>
<div id="viewport"><div id="stage"></div></div>

<!-- bar hide/show toggle -->
<button id="barToggle" onclick="toggleBar()" title="إخفاء/إظهار الشريط (B)">▼ أخفِ الشريط</button>

<div id="bar">
  <button onclick="location.href='../index.html'" title="العودة لمنصة جذور">🌳 جذور</button>
  <button onclick="toggleMenu()" title="المحاور (M)">☰ المحاور</button>
  <button onclick="window.open('https://zaytoon304.github.io/abaqreeno/','_blank')" title="العب الآن">🎮 العب الآن</button>
  <button onclick="prev()" title="السابق">→</button>
  <span class="cnt" id="cnt"></span>
  <button onclick="next()" title="التالي">←</button>
  <button onclick="fullscreen()" title="ملء الشاشة (F)">⛶ ملء الشاشة</button>
</div>
<div id="menu"><h3>محاور الدورة</h3><div class="mods" id="mods"></div></div>

<script src="content.js"></script>
<script>DECK.parts.forEach(p => document.write('<script src="parts/' + p + '.js"><\/script>'));</script>
<script src="widgetsA.js"></script>
<script src="../shared/deck.js"></script>
<script>
function toggleBar() {
  const hidden = document.body.classList.toggle('bar-hidden');
  document.getElementById('barToggle').textContent = hidden ? '▲ أظهر الشريط' : '▼ أخفِ الشريط';
}
// keyboard shortcut B
document.addEventListener('keydown', e => {
  if (e.key === 'b' || e.key === 'B') toggleBar();
});
</script>
</body>
</html>

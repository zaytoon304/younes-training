<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التقييم الذاتي — جذور</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<main class="m">
  <header><span class="logo">🌳</span><b>جذور</b><span id="course"></span></header>
  <section id="card" class="card">
    <div class="kick" id="kick"></div>
    <h1 id="title"></h1>
    <p style="margin-bottom:14px">اختر من ١ (لا أستطيع بعد) إلى ٥ (أتقنه تمامًا). إجابتك سرية ولا تحمل اسمك.</p>
    <div id="qs"></div>
    <button class="send" id="send" disabled>إرسال التقييم</button>
  </section>
  <section id="done" class="card done" hidden>
    <div class="big">✓</div><h1>شكرًا لك</h1><p id="donemsg">سُجّل تقييمك، وتظهر النتيجة الجماعية على الشاشة.</p>
  </section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="qrcode.js"></script>
<script>
  var P = new URLSearchParams(location.search), C = (P.get('c') || '').replace(/[^\w-]/g, '');
  window.DECK_HOOKS = [];
  document.write('<script src="../' + C + '/content.js"><\/script>');
</script>
<script src="live.js"></script>
<script>
(function () {
  LIVE.course = C;
  const mode = ['pre', 'post', 'followup'].includes(P.get('m')) ? P.get('m') : 'pre';
  const L = { pre: ['قبل الدورة', 'أين أنت الآن؟'], post: ['بعد الدورة', 'أين أصبحت الآن؟'], followup: ['بعد أسبوع من الدورة', 'ماذا طبّقت فعلًا؟'] }[mode];
  const R = DECK.selfrate;
  document.getElementById('course').textContent = DECK.title;
  document.getElementById('kick').textContent = '📊 التقييم الذاتي · ' + L[0];
  document.getElementById('title').textContent = L[1];
  const vals = Array(R.items.length).fill(0);
  document.getElementById('qs').innerHTML = R.items.map((q, i) => `<div class="q"><h3>${i + 1}. ${q}</h3>
    <div class="scale">${[1, 2, 3, 4, 5].map(v => `<button data-q="${i}" data-v="${v}">${v}</button>`).join('')}</div>
    <div class="ends"><span>لا أستطيع بعد</span><span>أتقنه تمامًا</span></div></div>`).join('');
  document.querySelectorAll('.scale button').forEach(b => b.onclick = () => {
    const q = +b.dataset.q; vals[q] = +b.dataset.v;
    document.querySelectorAll(`.scale button[data-q="${q}"]`).forEach(x => x.classList.toggle('on', x === b));
    document.getElementById('send').disabled = vals.includes(0);
  });
  const key = 'rated.' + C + '.' + mode + '.' + new Date().toDateString();
  if (localStorage.getItem(key)) { document.getElementById('card').hidden = true; document.getElementById('done').hidden = false; return; }
  document.getElementById('send').onclick = e => {
    e.target.disabled = true; e.target.textContent = 'جارٍ الإرسال…';
    LIVE.rate(mode, vals).then(() => {
      try { localStorage.setItem(key, '1'); } catch (x) {}
      document.getElementById('card').hidden = true; document.getElementById('done').hidden = false;
      if (mode === 'followup') document.getElementById('donemsg').textContent = 'شكرًا لأنك عدت بعد أسبوع. استمر… فالعادة تُبنى بالتكرار.';
    }).catch(() => { e.target.disabled = false; e.target.textContent = 'إرسال التقييم'; alert('تعذّر الإرسال، تحقق من الإنترنت'); });
  };
})();
</script>
</body>
</html>

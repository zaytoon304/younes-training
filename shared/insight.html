<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قراءة عقلية المتدربين — جذور</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#101B45;--gold:#D9AE4B;--goldl:#F0CC7A;--cream:#FBF7EE;--line:#E4DCC8;--muted:#5E6782;--ok:#2E9E6B;--bad:#C0392B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Cairo",Tahoma,sans-serif;background:#F4F1E8;color:var(--navy)}
header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:12px}
header b{color:var(--goldl);font-size:22px}header span{opacity:.85;font-weight:700}header .sp{margin-right:auto}
header button{font-family:inherit;font-weight:800;background:none;color:var(--goldl);border:1px solid rgba(240,204,122,.5);border-radius:999px;padding:5px 14px;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:22px}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 6px 20px rgba(16,27,69,.08);margin-bottom:18px}
.login{max-width:420px;margin:60px auto}
.login h1{font-size:24px;margin-bottom:8px}.login p{color:var(--muted);font-weight:700;margin-bottom:14px;line-height:1.7}
input{width:100%;font-family:inherit;font-size:17px;font-weight:700;border:2px solid var(--line);border-radius:12px;padding:11px;margin-bottom:10px}
.btn{font-family:inherit;font-size:17px;font-weight:900;border:0;border-radius:12px;padding:11px 18px;cursor:pointer;background:linear-gradient(145deg,var(--goldl),var(--gold));color:var(--navy)}
.btn.ghost{background:#EFE8D6}.link{background:none;border:0;color:#3B7DD8;font-family:inherit;font-weight:800;cursor:pointer;margin-top:8px}
.msg{padding:10px;border-radius:10px;margin:8px 0;font-weight:700}.msg.e{background:#FDECEA;color:var(--bad)}.msg.i{background:#E8F3EC;color:var(--ok)}
.warn{background:#FFF6DD;border:2px solid var(--goldl);border-radius:14px;padding:12px 16px;font-weight:700;line-height:1.7;font-size:15px}
.sum{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.sum div{border-radius:16px;padding:14px;color:#fff;text-align:center;cursor:pointer}.sum b{display:block;font-size:34px}.sum span{font-weight:800}
table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);font-size:15px}
th{font-size:13px;color:var(--muted)}tr.r{cursor:pointer}tr.r:hover{background:#FBF7EE}
.tag{display:inline-block;border-radius:999px;padding:3px 12px;color:#fff;font-weight:800;font-size:13px;white-space:nowrap}
.rep h2{font-size:26px}.rep h3{font-size:18px;margin:18px 0 8px;border-right:5px solid var(--gold);padding-right:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bar{margin:6px 0}.bar b{display:flex;justify-content:space-between;font-size:14px}.bar .tr{height:10px;border-radius:999px;background:#EEE6D3;overflow:hidden;margin-top:3px}.bar .tr i{display:block;height:100%;border-radius:999px}
.li{background:#FBF7EE;border-radius:12px;padding:9px 12px;margin-bottom:7px;font-weight:700;line-height:1.7;font-size:15px}
.li.red{background:#FDECEA}.li small{display:block;color:var(--muted)}
.obs td,.obs th{font-size:14px}.obs td:nth-child(n+2){text-align:center;width:60px}
@media print{header,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}main{padding:0}}
@media (max-width:800px){.sum{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><b>🌳 جذور</b><span id="course"></span><span class="sp"></span><span id="me"></span><button id="out" hidden>خروج</button></header>
<main id="app"></main>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="qrcode.js"></script>
<script>
  var P = new URLSearchParams(location.search), C = (P.get('c') || 'mawaqif').replace(/[^\w-]/g, '');
  window.DECK_HOOKS = [];
  document.write('<script src="../' + C + '/content.js"><\/script>');
</script>
<script>
  DECK.parts.forEach(function (p) { document.write('<script src="../' + C + '/parts/' + p + '.js"><\/script>'); });
  document.write('<script src="../' + C + '/insight-key.js"><\/script>');
</script>
<script src="live.js"></script>
<script src="insight.js"></script>
<script>
(function () {
const TRAINER = 'zaytoon304@gmail.com';
const K = DECK.insight, CATS = INSIGHT.CATS, app = document.getElementById('app'), auth = firebase.auth(), db = firebase.firestore();
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const col = v => v == null ? '#ccc' : v >= 80 ? '#2E9E6B' : v >= 65 ? '#3B7DD8' : v >= 45 ? '#D99A2B' : '#C0392B';
const bar = (name, v) => v == null ? '' : `<div class="bar"><b><span>${name}</span><span>${AR(v)}٪</span></b><div class="tr"><i style="width:${Math.max(3, v)}%;background:${col(v)}"></i></div></div>`;
document.getElementById('course').textContent = '· ' + DECK.title + ' · قراءة عقلية المتدربين';

/* ---------- دخول المدرب ---------- */
function login(msg) {
  app.innerHTML = `<div class="card login"><h1>🔐 لوحة المدرب</h1>
    <p>تقارير المتدربين خاصة، لا يفتحها إلا المدرب بحسابه.</p>
    <button class="btn" id="g" style="width:100%;margin-bottom:14px">الدخول بحساب جوجل (${TRAINER})</button>
    ${msg ? `<div class="msg ${msg[0]}">${msg[1]}</div>` : ''}
    <details><summary style="cursor:pointer;font-weight:800;color:var(--muted);margin-bottom:10px">أو بالبريد وكلمة السر</summary>
    <input id="em" value="${TRAINER}" dir="ltr"><input id="pw" type="password" placeholder="كلمة السر" dir="ltr">
    <button class="btn ghost" id="go" style="width:100%">دخول</button>
    <button class="link" id="new">أول مرة؟ أنشئ حساب المدرب</button> · <button class="link" id="reset">نسيت كلمة السر</button></details></div>`;
  document.getElementById('g').onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider().setCustomParameters({ login_hint: TRAINER }))
    .catch(e => login(['e', e.code === 'auth/unauthorized-domain' ? 'هذا الموقع غير مضاف لنطاقات Firebase المسموحة (Authentication ← Settings ← Authorized domains)' : e.code === 'auth/popup-closed-by-user' ? 'أُغلقت نافذة جوجل قبل الدخول' : 'تعذّر الدخول بجوجل: ' + e.code]));
  const em = () => document.getElementById('em').value.trim(), pw = () => document.getElementById('pw').value;
  document.getElementById('go').onclick = () => auth.signInWithEmailAndPassword(em(), pw()).catch(() => login(['e', 'البريد أو كلمة السر غير صحيحة']));
  document.getElementById('new').onclick = () => {
    if (pw().length < 8) return login(['e', 'اختر كلمة سر قوية: ٨ أحرف على الأقل']);
    auth.createUserWithEmailAndPassword(em(), pw()).then(c => c.user.sendEmailVerification())
      .then(() => login(['i', 'أُرسل رابط تفعيل إلى بريدك. افتحه واضغط الرابط، ثم عد وادخل هنا.']))
      .catch(e => login(['e', e.code === 'auth/email-already-in-use' ? 'الحساب موجود مسبقًا، ادخل بكلمة سرك' : 'تعذّر إنشاء الحساب']));
  };
  document.getElementById('reset').onclick = () => auth.sendPasswordResetEmail(em()).then(() => login(['i', 'أُرسل رابط تغيير كلمة السر إلى بريدك']));
}

auth.onAuthStateChanged(async u => {
  const out = document.getElementById('out');
  if (!u) { out.hidden = true; return login(); }
  if (u.email !== TRAINER) { await auth.signOut(); return login(['e', 'هذه اللوحة للمدرب فقط']); }
  await u.reload();
  if (!auth.currentUser.emailVerified) return login(['e', 'فعّل حسابك أولًا من الرابط المرسل إلى بريدك، ثم ادخل مرة أخرى']);
  out.hidden = false; out.onclick = () => auth.signOut();
  document.getElementById('me').textContent = u.email;
  load();
});

/* ---------- تحميل المتدربين وتحليلهم ---------- */
let ALL = [];
async function load() {
  app.innerHTML = '<div class="card">جارٍ تحميل إجابات المتدربين وتحليلها…</div>';
  try {
    const ref = db.collection('courses').doc(C).collection('trainees');
    const ts = await ref.get();
    ALL = await Promise.all(ts.docs.map(async d => {
      const it = {}; (await d.ref.collection('items').get()).forEach(x => it[x.id] = x.data());
      return Object.assign({ id: d.id }, d.data(), { R: INSIGHT.analyze(DECK, it) });
    }));
    list();
  } catch (e) { app.innerHTML = `<div class="card msg e">تعذّر التحميل: ${esc(e.message)}</div>`; }
}

const ORDER = ['direct', 'support', 'good', 'star', 'insufficient'];
function list(filter) {
  const rows = ALL.filter(t => !filter || t.R.category.id === filter)
    .sort((a, b) => ORDER.indexOf(a.R.category.id) - ORDER.indexOf(b.R.category.id) || (a.R.judgment || 0) - (b.R.judgment || 0));
  const count = c => ALL.filter(t => t.R.category.id === c).length;
  app.innerHTML = `
    <div class="card warn">⚖️ هذه مؤشرات مبنية على قرارات المتدرب داخل الدورة وفق منهجية اختبارات الحكم على المواقف ونموذج سلوك المعلم (وبلز) وأيديولوجية ضبط الطلاب. هي قراءة قوية لطريقة التفكير، <b>لكنها ليست حكمًا نهائيًا</b>؛ قبل أي قرار إداري تُستكمل بملاحظة صفية فعلية (البطاقة في آخر كل تقرير).</div>
    <div class="sum noprint">${['star', 'good', 'support', 'direct', 'insufficient'].map(c => `<div data-c="${c}" style="background:${CATS[c].color}"><b>${AR(count(c))}</b><span>${CATS[c].icon} ${CATS[c].name}</span></div>`).join('')}</div>
    <div class="card" style="margin-top:18px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2>المتدربون (${AR(rows.length)})${filter ? ' · ' + CATS[filter].name : ''}</h2>
        <span class="noprint">${filter ? '<button class="btn ghost" id="all">عرض الجميع</button> ' : ''}<button class="btn ghost" id="refresh">تحديث</button> <button class="btn ghost" onclick="print()">طباعة</button></span></div>
      ${rows.length ? `<table><tr><th>الاسم</th><th>المدرسة</th><th>التصنيف</th><th>جودة القرار</th><th>النمط الغالب</th><th>القابلية للتطوير</th><th>🚩</th><th>القرارات</th></tr>
      ${rows.map(t => { const R = t.R, c = CATS[R.category.id]; return `<tr class="r" data-id="${t.id}"><td><b>${esc(t.name)}</b></td><td>${esc(t.school)}</td>
        <td><span class="tag" style="background:${c.color}">${c.icon} ${c.name}</span></td>
        <td style="color:${col(R.judgment)};font-weight:900">${R.judgment == null ? '—' : AR(R.judgment) + '٪'}</td>
        <td>${R.dominant ? K.styles[R.dominant].icon + ' ' + K.styles[R.dominant].name : '—'}</td>
        <td>${{ high: 'عالية', mid: 'متوسطة', low: 'منخفضة' }[R.coachLevel] || '—'}</td>
        <td style="color:var(--bad);font-weight:900">${R.flags.length ? AR(R.flags.length) : ''}</td><td>${AR(R.n)}</td></tr>`; }).join('')}</table>`
      : '<p>لا يوجد متدربون بعد. تظهر الأسماء هنا بمجرد أن يسجّلوا من جوالاتهم.</p>'}</div>`;
  document.querySelectorAll('.sum div').forEach(d => d.onclick = () => list(d.dataset.c));
  document.querySelectorAll('tr.r').forEach(r => r.onclick = () => report(ALL.find(t => t.id === r.dataset.id)));
  const a = document.getElementById('all'); if (a) a.onclick = () => list();
  document.getElementById('refresh').onclick = load;
}

/* ---------- تقرير متدرب واحد ---------- */
const ADVICE = {
  star: ['أشركه في دعم زملائه: حصة نموذجية أو قيادة مجتمع تعلّم', 'رشّحه لدور إرشادي للمعلمين الجدد'],
  good: ['متابعة خفيفة مركّزة على المجالات المذكورة أعلاه', 'زيارة صفية ودية واحدة خلال الفصل الدراسي'],
  support: ['خطة دعم مكتوبة: هدف واحد واضح لكل شهر', 'مرافقة زميل من فئة «جدير ومميز» وحضور حصتين له', 'زيارة صفية بعد شهر لقياس التقدم'],
  direct: ['لقاء توجيهي فردي هادئ يبدأ بنقاط قوته، ثم يعرض أنماط القرار المقلقة بأمثلة من إجاباته', 'زيارة صفية قريبة ببطاقة الملاحظة أدناه، ويفضّل غير معلنة الموعد بدقة', 'خطة تحسين مكتوبة بمدة محددة ومتابعة أسبوعية', 'إن تأكدت الإشارات الحمراء في الملاحظة الفعلية: تحويل الأمر لقيادة المدرسة لحماية الطلاب'],
  insufficient: ['اطلب منه إكمال التصويت في المواقف، أو قيّمه بالملاحظة الصفية مباشرة'],
};
const OBS = [
  'يتعامل مع أخطاء الطلاب بهدوء واحترام، دون سخرية أو تجريح',
  'يعالج المخالفات بحوار خاص، لا بالعقوبة العلنية',
  'يطبّق القواعد بثبات وعدل على جميع الطلاب',
  'يستمع لوجهة نظر الطالب قبل أن يحكم عليه',
  'يلاحظ الطالب المنعزل أو المتضايق ويتدخل لدعمه',
  'القواعد والإجراءات واضحة ويعرفها الطلاب',
  'يستثمر الوقت في التعلم؛ الانقطاعات قليلة ويعالجها بسرعة',
  'علاقته بالطلاب دافئة، والطلاب يشاركون دون خوف',
];
function report(t) {
  const R = t.R, c = CATS[R.category.id], S = K.styles;
  const styled = Object.values(R.styles).reduce((a, b) => a + b, 0) || 1;
  const mind = INSIGHT.mindText(R, K);
  app.innerHTML = `<div class="noprint" style="margin-bottom:12px"><button class="btn ghost" id="back">→ رجوع للقائمة</button> <button class="btn ghost" onclick="print()">🖨️ طباعة التقرير</button></div>
  <div class="card rep">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
      <div><h2>${esc(t.name)}</h2><p style="color:var(--muted);font-weight:700">${esc(t.school)} · ${DECK.title} · ${AR(R.n)} قرارًا</p></div>
      <div style="text-align:center"><span class="tag" style="background:${c.color};font-size:18px;padding:8px 18px">${c.icon} ${c.name}</span><p style="max-width:320px;margin-top:6px;font-weight:700;color:var(--muted)">${c.note}</p></div>
    </div>
    <h3>🧠 كيف يفكر؟</h3>${mind.map(x => `<div class="li">${x}</div>`).join('') || '<div class="li">—</div>'}
    <h3>📌 أسباب التصنيف</h3>${R.category.reasons.map(x => `<div class="li">${x}</div>`).join('')}
    <div class="grid2">
      <div><h3>🧭 نمط القيادة الصفية (وبلز)</h3>${Object.keys(S).map(k => bar(S[k].icon + ' ' + S[k].name, Math.round(R.styles[k] / styled * 100))).join('')}
        <p style="font-weight:700;color:var(--muted);margin-top:6px">الحزم: ${R.control >= 0.3 ? 'مرتفع' : R.control <= -0.3 ? 'منخفض' : 'متوسط'} · الدفء: ${R.warmth >= 0.3 ? 'مرتفع' : R.warmth <= -0.3 ? 'منخفض' : 'متوسط'}</p></div>
      <div><h3>📊 جودة القرار حسب المجال</h3>${bar('الإجمالي', R.judgment)}${Object.values(R.areas).map(a => bar(a.name, a.score)).join('')}</div>
    </div>
    <div class="grid2">
      <div><h3>💭 القناعات التربوية</h3>${R.poll ? Object.values(R.poll).map(p => bar(p.name, p.score)).join('') : '<div class="li">لم يُجب عن استطلاع القناعات</div>'}
        ${bar('سلامة المفاهيم (صح أم خطأ)', R.mythScore)}
        ${R.mythsBelieved.length ? R.mythsBelieved.map(m => `<div class="li red">يرى صحة: «${m.text}»<small>${K.beliefNames[m.tag]}</small></div>`).join('') : ''}</div>
      <div><h3>🪞 الوعي بالذات والقابلية للتطوير</h3>
        ${bar('تقديره لنفسه قبل الدورة', R.selfPre)}${bar('قراراته الفعلية', R.judgment)}${bar('تقديره لنفسه بعد الدورة', R.selfPost)}
        ${R.overconfident ? `<div class="li red">يقدّر نفسه أعلى من أدائه الفعلي بفارق ${AR(R.gap)} نقطة، فقد لا يرى حاجته للتطوير</div>` : ''}
        ${bar('أول قرارات الدورة', R.early)}${bar('مواقف العيادة الجديدة (آخر الدورة)', R.late)}
        ${R.growth != null ? `<div class="li">${R.growth > 10 ? '📈 تحسّن واضح خلال الدورة (+' + AR(R.growth) + ')' : R.growth < -10 ? '📉 تراجع في آخر الدورة (' + AR(R.growth) + ')' : '➖ لا تغيّر يُذكر خلال الدورة'}</div>` : ''}
        ${bar('القابلية للتطوير (مؤشر مركّب)', R.coach)}</div>
    </div>
    <h3>🚩 الإشارات الحمراء</h3>${R.flags.length ? R.flags.map(f => `<div class="li red"><b>${K.flags[f.flag] || 'اختيار ضار'}</b> — ${f.title}<small>اختار: ${f.chosen}</small></div>`).join('') : '<div class="li">لا توجد ✓</div>'}
    <h3>📋 قراراته في المواقف</h3>
    <table><tr><th>الموقف</th><th>اختياره</th><th>النمط</th><th>الفاعلية</th></tr>
      ${R.decisions.map(d => `<tr><td>${d.title}</td><td>${d.chosen}</td><td>${d.style ? S[d.style].icon + ' ' + S[d.style].name : '—'}</td><td style="color:${col((d.eff - 1) / 3 * 100)};font-weight:900">${'●'.repeat(d.eff)}${'○'.repeat(4 - d.eff)}</td></tr>`).join('')}</table>
    <h3>🎯 توصيات للمشرف</h3>${ADVICE[R.category.id].map(x => `<div class="li">${x}</div>`).join('')}
    ${R.weakAreas.length ? `<div class="li">المجالات التي تحتاج تطويرًا: ${R.weakAreas.join('، ')}</div>` : ''}
    ${R.tips.length ? `<div class="li">نصائح عملية تناسب نمطه: ${R.tips.join(' · ')}</div>` : ''}
  </div>
  <div class="card obs"><h3 style="margin-top:0">👁️ بطاقة الملاحظة الصفية (للتحقق قبل أي قرار)</h3>
    <p style="font-weight:700;color:var(--muted);margin-bottom:10px">مؤشرات سلوكية مستلهمة من مجالات الدعم العاطفي وتنظيم الفصل في أداة CLASS (Pianta وزملاؤه، جامعة فيرجينيا). ضع علامة أثناء زيارة حصة كاملة.</p>
    <table><tr><th>المؤشر</th><th>دائمًا</th><th>أحيانًا</th><th>نادرًا</th></tr>${OBS.map(o => `<tr><td>${o}</td><td>☐</td><td>☐</td><td>☐</td></tr>`).join('')}</table>
    <p style="margin-top:12px;font-weight:700">ملاحظات المشرف: ...........................................................................................</p></div>`;
  document.getElementById('back').onclick = () => list();
  scrollTo(0, 0);
}
})();
</script>
</body>
</html>

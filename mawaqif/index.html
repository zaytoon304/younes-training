<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مواقف صفية — جذور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ألوان هوية منصة جذور */
:root{
  --navy-900:#0A1230; --navy-800:#101B45; --navy-700:#182658; --navy-600:#22346F; --navy-500:#2E4288;
  --gold:#D9AE4B; --gold-dark:#B08A2E; --gold-light:#F0CC7A;
  --cream:#FBF7EE; --ink:#131B34; --muted:#5E6782; --line:#E4DCC8;
  --bad:#D64545; --bad-bg:#FBECEC; --ok:#2E9E6B; --ok-bg:#E6F4EC;
  --naskh:"Amiri","Traditional Arabic",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050a1c;overflow:hidden;font-family:"Cairo","Segoe UI",Tahoma,sans-serif;color:var(--ink)}

/* مسرح العرض: لوحة ثابتة 1920×1080 تُكبَّر أو تُصغَّر لتملأ الشاشة */
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1920px;height:1080px;position:relative;flex:none;transform-origin:center center;overflow:hidden;
  box-shadow:0 30px 120px rgba(0,0,0,.6)}
.slide{position:absolute;inset:0;padding:84px 130px 130px;display:flex;flex-direction:column}

/* خلفيتان: داكنة للعناوين والنصوص الشرعية، وفاتحة للمحتوى الكثيف (أوضح على البروجكتر) */
.dark{background:radial-gradient(1200px 800px at 85% 10%,rgba(46,66,136,.55),transparent 60%),
  radial-gradient(900px 700px at 5% 100%,rgba(217,174,75,.16),transparent 60%),
  linear-gradient(160deg,var(--navy-800),var(--navy-900));color:#fff}
.dark::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff8,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff6,transparent),
  radial-gradient(1px 1px at 40% 80%,#fff7,transparent),radial-gradient(1.5px 1.5px at 90% 70%,#fff5,transparent),
  radial-gradient(1px 1px at 55% 45%,#fff6,transparent),radial-gradient(1px 1px at 10% 60%,#fff5,transparent)}
.light{background:linear-gradient(180deg,#fff 0%,var(--cream) 100%)}
.light::after{content:"";position:absolute;top:0;right:0;width:26px;height:100%;
  background:linear-gradient(180deg,var(--gold-light),var(--gold-dark))}

/* تذييل ثابت بكل شريحة */
.foot{position:absolute;bottom:36px;left:130px;right:130px;display:flex;align-items:center;gap:18px;font-size:24px;font-weight:700;opacity:.75}
.foot .brand{display:flex;align-items:center;gap:10px}
.foot .brand b{color:var(--gold)}
.foot .sp{flex:1}
.dark .foot{color:#c9cfe6}
.light .foot{color:var(--muted)}

/* عناصر مشتركة */
.kicker{display:inline-block;align-self:flex-start;font-size:32px;font-weight:800;padding:10px 30px;border-radius:999px;margin-bottom:20px}
.dark .kicker{background:rgba(217,174,75,.16);color:var(--gold-light);border:2px solid rgba(217,174,75,.4)}
.light .kicker{background:#F6EBCF;color:var(--gold-dark)}
h2.title.long{font-size:62px}
h2.title{font-size:76px;font-weight:900;line-height:1.25;margin-bottom:36px}
.light h2.title{color:var(--navy-800)}
.sub{font-size:40px;font-weight:600;opacity:.8;margin-top:-26px;margin-bottom:44px}
.src{font-size:30px;font-weight:700;color:var(--gold);margin-top:34px}

/* الظهور التدريجي بالنقر (مثل حركات البوربوينت) */
.f{opacity:0;transform:translateY(24px);transition:opacity .45s ease,transform .45s ease}
.f.in{opacity:1;transform:none}
.enter{animation:enter .55s ease both}
@keyframes enter{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}

/* الغلاف */
.cover{align-items:center;justify-content:center;text-align:center}
.cover .logo{width:150px;height:150px;border-radius:40px;background:linear-gradient(145deg,var(--gold-light),var(--gold-dark));
  display:flex;align-items:center;justify-content:center;font-size:90px;box-shadow:0 20px 60px rgba(217,174,75,.35);margin-bottom:40px}
.cover .tag{font-size:36px;font-weight:700;color:var(--gold-light);letter-spacing:1px}
.cover h1{font-size:190px;font-weight:900;line-height:1.1;margin:10px 0 20px;
  background:linear-gradient(180deg,#fff 30%,#F0CC7A);-webkit-background-clip:text;background-clip:text;color:transparent}
.cover .subt{font-size:54px;font-weight:700}
.cover .by{margin-top:70px;font-size:36px;font-weight:700;color:#c9cfe6}
.cover .by b{color:var(--gold)}
.goldline{width:220px;height:6px;border-radius:6px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:36px auto}

/* فاصل المحور */
.section{justify-content:center}
.section .num{position:absolute;left:170px;top:50%;transform:translateY(-50%);width:420px;height:420px;border-radius:50%;
  border:10px solid rgba(217,174,75,.55);box-shadow:0 0 0 30px rgba(217,174,75,.08),inset 0 0 80px rgba(217,174,75,.18);
  display:flex;align-items:center;justify-content:center;font-size:250px;font-weight:900;color:var(--gold-light);line-height:1}
.section .lbl{font-size:40px;font-weight:800;color:var(--gold)}
.section h2{font-size:120px;font-weight:900;line-height:1.15;margin:14px 0 24px;max-width:1100px}
.section p{font-size:46px;font-weight:600;color:#c9cfe6;max-width:1100px}

/* الحديث والآية والعبارة الكبيرة */
.center{justify-content:center;align-items:center;text-align:center}
.center .kicker{align-self:center}
.hadith-box{position:relative;max-width:1500px;padding:60px 90px}
.hadith-box::before,.hadith-box::after{content:"";display:block;width:260px;height:5px;margin:0 auto;border-radius:5px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.hadith-box::before{margin-bottom:50px} .hadith-box::after{margin-top:50px}
.naskh{font-family:var(--naskh);font-weight:700;font-size:84px;line-height:1.7}
.ayah{font-family:var(--naskh);font-weight:700;font-size:92px;line-height:1.8;max-width:1550px}
.ayah .br{color:var(--gold)}
.statement{font-size:92px;font-weight:900;line-height:1.45;max-width:1560px}
.statement .hl{color:var(--gold-light)}

/* البطاقات */
.cards{display:grid;gap:44px;flex:1;align-content:center}
.card{background:#fff;border:2px solid var(--line);border-radius:36px;padding:50px 46px;box-shadow:0 16px 40px rgba(16,27,69,.08);
  display:flex;flex-direction:column;gap:18px}
.card .ic{width:110px;height:110px;border-radius:30px;background:linear-gradient(145deg,#FBEFD2,#F3DCA3);display:flex;align-items:center;justify-content:center;font-size:64px}
.card h3{font-size:48px;font-weight:900;color:var(--navy-800)}
.card p{font-size:38px;font-weight:600;line-height:1.55;color:#3b4460}

/* الجمل الجاهزة */
.lines{display:flex;flex-direction:column;gap:20px;flex:1;justify-content:center}
.bubble.long{font-size:36px;padding:20px 38px;line-height:1.45}
.line{display:grid;grid-template-columns:250px 1fr;gap:34px;align-items:center}
.line .who{font-size:30px;font-weight:800;color:var(--navy-600);background:#E9EDF9;border-radius:22px;padding:22px 26px;text-align:center}
.bubble{position:relative;background:var(--navy-800);color:#fff;border-radius:34px;padding:26px 42px;font-size:42px;font-weight:700;line-height:1.5}
.bubble::before{content:"";position:absolute;right:-18px;top:50%;margin-top:-18px;border:18px solid transparent;border-left-color:var(--navy-800);border-right:0}
.bubble .q{color:var(--gold);font-size:56px;font-family:var(--naskh);margin-left:8px}
.warn{margin-top:14px;margin-bottom:20px;background:var(--bad-bg);border-right:12px solid var(--bad);border-radius:20px;padding:16px 36px;font-size:34px;font-weight:700;color:#8e2a2a}

/* النشاط */
.activity{display:grid;grid-template-columns:1fr 460px;gap:70px;flex:1;align-items:center}
.steps{display:flex;flex-direction:column;gap:30px}
.step{display:flex;gap:30px;align-items:center;font-size:46px;font-weight:700;line-height:1.45}
.step .n{flex:none;width:96px;height:96px;border-radius:50%;background:var(--gold);color:var(--navy-900);font-size:48px;font-weight:900;display:flex;align-items:center;justify-content:center}
.timer{aspect-ratio:1;border-radius:50%;border:14px solid rgba(217,174,75,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
  background:rgba(255,255,255,.04);transition:border-color .3s}
.timer .t{font-size:130px;font-weight:900;color:var(--gold-light);font-variant-numeric:tabular-nums;direction:ltr}
.timer .h{font-size:30px;font-weight:700;color:#c9cfe6}
.timer.run{border-color:var(--gold)}
.timer.done{border-color:var(--ok)}

/* النبي ﷺ معلّمًا */
.prophet{display:grid;grid-template-columns:1.15fr 1fr;gap:70px;flex:1;align-items:center}
.prophet .story{font-size:40px;font-weight:600;line-height:1.7;color:#d9def0}
.prophet .pq{margin-top:34px;font-family:var(--naskh);font-weight:700;font-size:54px;line-height:1.7;color:var(--gold-light);border-right:8px solid var(--gold);padding-right:34px}
.prophet .pq small{display:block;font-family:"Cairo";font-size:28px;color:var(--gold);margin-top:10px}
.lessons{background:rgba(255,255,255,.06);border:2px solid rgba(217,174,75,.35);border-radius:40px;padding:50px}
.lessons h4{font-size:40px;font-weight:900;color:var(--gold);margin-bottom:30px}
.lessons .l{display:flex;gap:22px;align-items:flex-start;font-size:40px;font-weight:700;line-height:1.5;margin-bottom:26px}
.lessons .l i{flex:none;font-style:normal;width:56px;height:56px;border-radius:50%;background:var(--gold);color:var(--navy-900);font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:6px}

/* لغز القصة */
.words{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:40px}
.word{font-size:40px;font-weight:800;background:#F6EBCF;color:var(--gold-dark);border-radius:18px;padding:12px 30px}
.ptext{font-size:42px;font-weight:600;line-height:1.95;background:#fff;border:2px dashed var(--line);border-radius:30px;padding:40px 50px}
.ptext .blank{display:inline-block;min-width:130px;border-bottom:4px solid var(--gold);margin:0 6px}
.pz.revealed .words,.pz.revealed .ptext{display:none}
.pz:not(.revealed) .answer{display:none}
.answer{animation:enter .5s ease both;background:var(--navy-800);color:#fff;border-radius:36px;padding:56px 64px;font-size:46px;font-weight:600;line-height:1.9;
  box-shadow:0 30px 80px rgba(0,0,0,.3)}
.answer b{color:var(--gold-light)}

/* التصويت */
.opts{display:flex;flex-direction:column;gap:26px;flex:1;justify-content:center}
.opt{display:flex;align-items:center;gap:32px;background:#fff;border:3px solid var(--line);border-radius:28px;padding:26px 36px;font-size:44px;font-weight:700;transition:all .4s}
.opt .L{flex:none;width:90px;height:90px;border-radius:24px;background:var(--navy-800);color:#fff;font-size:48px;font-weight:900;display:flex;align-items:center;justify-content:center}
.opt .w{display:none;font-size:32px;font-weight:600;margin-top:8px;line-height:1.45}
.opt .tx{flex:1}
.revealed .opt{opacity:.55;background:#fff}
.revealed .opt .w{display:block;color:#7a3434}
.revealed .opt.ok{opacity:1;border-color:var(--ok);background:var(--ok-bg);transform:scale(1.02)}
.revealed .opt.ok .L{background:var(--ok)}
.revealed .opt.ok .w{color:#1d6b47}
.opts.compact{gap:16px}
.opts.compact .opt{padding:14px 28px;font-size:36px;gap:24px}
.opts.compact .opt .L{width:66px;height:66px;font-size:36px;border-radius:18px}
.opts.compact .opt .w{font-size:28px;margin-top:2px}
.revealed .opts.compact .opt.ok,.revealed.compact .opt.ok{transform:none}

/* الرسم البياني */
.chart{flex:1;display:flex;align-items:flex-end;gap:50px;padding:0 20px 0;border-bottom:4px solid var(--navy-800);margin-bottom:24px;position:relative}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar .v{font-size:60px;font-weight:900;margin-bottom:12px}
.bar .col{width:100%;border-radius:24px 24px 0 0;height:0;transition:height 1.1s cubic-bezier(.2,.8,.2,1)}
.bar.bad .col{background:linear-gradient(180deg,#E36B6B,#B83232)} .bar.bad .v{color:var(--bad)}
.bar.mid .col{background:linear-gradient(180deg,#9AA6C8,#5E6C98)} .bar.mid .v{color:#5E6C98}
.bar.base .col{background:repeating-linear-gradient(45deg,#D8DCE8,#D8DCE8 14px,#C6CBDB 14px,#C6CBDB 28px)} .bar.base .v{color:var(--muted)}
.bar.good .col{background:linear-gradient(180deg,#5CC596,#2E9E6B)} .bar.good .v{color:var(--ok)}
.bar.best .col{background:linear-gradient(180deg,var(--gold-light),var(--gold-dark))} .bar.best .v{color:var(--gold-dark)}
.blabels{display:flex;gap:50px;padding:0 20px}
.blabels div{flex:1;text-align:center;font-size:32px;font-weight:800;line-height:1.35;color:var(--navy-800);white-space:pre-line}
.chart-src{font-size:26px;font-weight:600;color:var(--muted);margin-top:20px}

/* خريطة المحطات */
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;flex:1;align-content:center}
.stop{display:flex;align-items:center;gap:26px;background:#fff;border:2px solid var(--line);border-radius:28px;padding:26px 30px}
.stop .i{flex:none;width:92px;height:92px;border-radius:26px;background:var(--navy-800);display:flex;align-items:center;justify-content:center;font-size:50px}
.stop .nm{font-size:38px;font-weight:800;color:var(--navy-800);line-height:1.3}
.stop .no{font-size:26px;font-weight:800;color:var(--gold-dark)}

/* غلاف الموقف */
.mcover{justify-content:center}
.mcover .cat{font-size:40px;font-weight:800;color:var(--gold)}
.mcover .lbl{font-size:52px;font-weight:800;color:#c9cfe6;margin-top:20px}
.mcover h2{font-size:150px;font-weight:900;line-height:1.1;margin-top:6px}
.mcover .big{position:absolute;left:170px;top:50%;transform:translateY(-50%) rotate(-8deg);font-size:340px;filter:drop-shadow(0 30px 60px rgba(0,0,0,.45))}
.flow{display:flex;gap:18px;margin-top:70px;flex-wrap:wrap}
.flow span{font-size:30px;font-weight:700;padding:12px 26px;border-radius:999px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15)}

/* القصة */
.story-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px}
.para{font-size:46px;font-weight:600;line-height:1.7;padding-right:40px;border-right:6px solid var(--line)}
.para.last{font-weight:900;color:var(--bad);border-right-color:var(--bad);font-size:50px}

/* لماذا؟ */
.why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:30px;flex:1;align-content:center;margin-bottom:30px}
.why-grid .card{padding:34px 30px;text-align:center;align-items:center;gap:12px}
.why-grid .card p{font-size:32px}
.why-grid .card .ic{width:88px;height:88px;font-size:50px}
.why-grid .card h3{font-size:44px}
.key{margin-bottom:40px;background:var(--navy-800);color:#fff;border-radius:30px;padding:34px 50px;font-size:44px;font-weight:800;line-height:1.5;text-align:center}
.key b{color:var(--gold-light)}

/* أول 10 ثوانٍ */
.f10{display:grid;grid-template-columns:repeat(4,1fr);gap:30px;flex:1;align-content:center;position:relative}
.f10 .s{background:#fff;border:2px solid var(--line);border-radius:36px;padding:50px 34px;text-align:center;position:relative}
.f10 .s .n{width:110px;height:110px;margin:0 auto 26px;border-radius:50%;background:linear-gradient(145deg,var(--gold-light),var(--gold-dark));color:var(--navy-900);
  font-size:56px;font-weight:900;display:flex;align-items:center;justify-content:center}
.f10 .s h3{font-size:54px;font-weight:900;color:var(--navy-800);margin-bottom:14px}
.f10 .s p{font-size:36px;font-weight:600;line-height:1.5;color:#3b4460}
.clock{position:absolute;left:130px;top:100px;font-size:34px;font-weight:900;color:var(--bad);background:var(--bad-bg);padding:12px 28px;border-radius:999px}

/* سلّم التدخل */
.ladder{flex:1;display:flex;flex-direction:column-reverse;justify-content:center;gap:12px;margin-bottom:40px}
.rung{display:flex;align-items:center;gap:26px;border-radius:24px;padding:12px 30px;font-size:36px;font-weight:800;color:#fff}
.rung .n{flex:none;width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900}

/* خطأ وبديل */
.dd{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px}
.dd .hd,.dd .r{display:grid;grid-template-columns:1fr 90px 1fr;align-items:stretch}
.dd .hd div{font-size:40px;font-weight:900;text-align:center;padding-bottom:6px}
.dd .hd .x{color:var(--bad)} .dd .hd .v{color:var(--ok)}
.dd .c{border-radius:24px;padding:26px 34px;font-size:38px;font-weight:700;line-height:1.45;display:flex;align-items:center}
.dd .c.x{background:var(--bad-bg);color:#8e2a2a;text-decoration:line-through;text-decoration-color:rgba(214,69,69,.45);text-decoration-thickness:3px}
.dd .c.v{background:var(--ok-bg);color:#1d5e40}
.dd .ar{display:flex;align-items:center;justify-content:center;font-size:50px;color:var(--gold-dark);font-weight:900}

/* الصور المرسومة: حركة كاميرا سينمائية بطيئة */
.kb{overflow:hidden;position:relative}
.kb img{width:100%;height:100%;object-fit:cover;display:block;animation:kb 18s ease-in-out infinite alternate;transform-origin:60% 45%}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.13) translate(-2.5%,-1.5%)}}
.mcover .bgimg{position:absolute;inset:0;z-index:0}
.mcover .bgimg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to left,rgba(10,18,48,.96) 0%,rgba(10,18,48,.86) 38%,rgba(10,18,48,.25) 70%,rgba(10,18,48,.05) 100%)}
.mcover > *:not(.bgimg){position:relative;z-index:1}
.story-grid{flex:1;display:grid;grid-template-columns:1.35fr 1fr;gap:50px;min-height:0}
.story-grid .story-wrap{gap:16px}
.story-grid .para{font-size:35px;line-height:1.55;padding-right:30px}
.story-grid .para.last{font-size:38px}
.scene{border-radius:36px;box-shadow:0 24px 60px rgba(16,27,69,.25);border:6px solid #fff;align-self:center;aspect-ratio:16/9;width:100%}

/* صح أم خطأ */
.myth{flex:1;display:flex;flex-direction:column;justify-content:center;gap:40px;position:relative}
.myth .claim{background:#fff;border:3px solid var(--line);border-radius:36px;padding:56px 70px;font-size:62px;font-weight:900;line-height:1.45;color:var(--navy-800);position:relative}
.myth .claim::before{content:"❝";position:absolute;top:-50px;right:40px;font-size:110px;color:var(--gold)}
.myth .stamp{position:absolute;left:90px;top:40px;transform:rotate(-12deg);border:10px solid var(--bad);color:var(--bad);border-radius:26px;
  padding:6px 40px;font-size:88px;font-weight:900;background:rgba(255,255,255,.9)}
.myth .stamp.f{transform:rotate(-12deg) scale(1.6)} .myth .stamp.f.in{transform:rotate(-12deg) scale(1)}
.myth .fix{background:var(--ok-bg);border-right:14px solid var(--ok);border-radius:28px;padding:36px 50px;font-size:44px;font-weight:700;line-height:1.55;color:#1d5e40}
.myth .fix b{color:var(--ok)}

/* جدول */
.tbl{flex:1;display:flex;flex-direction:column;justify-content:center;gap:11px}
.tbl .tr{display:grid;gap:14px}
.tbl .th{font-size:32px;font-weight:900;color:#fff;background:var(--navy-800);border-radius:18px;padding:16px 24px;text-align:center}
.tbl .td{font-size:29px;font-weight:700;line-height:1.35;background:#fff;border:2px solid var(--line);border-radius:18px;padding:11px 22px;display:flex;align-items:center}
.tbl .td:first-child{font-weight:900;color:var(--navy-800);background:#FBF3DF;border-color:#EFDDAF}
.tbl .td:last-child{color:#1d5e40;background:var(--ok-bg);border-color:#CDE9D9}

/* مربع الأنماط */
.quad{flex:1;display:grid;grid-template-columns:100px 1fr 1fr;grid-template-rows:1fr 1fr 50px;gap:20px;min-height:0;margin-bottom:10px}
.quad .ax{display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:var(--muted)}
.quad .ax.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.quad .cell{border-radius:30px;padding:20px 36px;display:flex;flex-direction:column;justify-content:center;gap:10px;border:3px solid var(--line);background:#fff}
.quad .cell .ci{font-size:48px;line-height:1}
.quad .cell h3{font-size:44px;font-weight:900;color:var(--navy-800)}
.quad .cell p{font-size:29px;font-weight:700;color:#3b4460;line-height:1.45}
.quad .cell.best{background:linear-gradient(145deg,#FFF6DD,#F7E2AA);border-color:var(--gold)}
.quad .cell.best h3::after{content:" ⭐"}

/* قائمة مرقمة */
.numlist{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.numlist .it{display:flex;gap:28px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:26px;padding:14px 32px}
.numlist .it .n{flex:none;width:72px;height:72px;border-radius:50%;background:linear-gradient(145deg,var(--gold-light),var(--gold-dark));color:var(--navy-900);font-size:44px;font-weight:900;display:flex;align-items:center;justify-content:center}
.numlist .it h3{font-size:38px;font-weight:900;color:var(--navy-800)}
.numlist.compact .it{padding:12px 30px} .numlist.compact .it > div{display:flex;gap:22px;align-items:baseline;flex-wrap:wrap}
.numlist.compact .it p::before{content:'— ';color:var(--gold-dark)}
.numlist .it p{font-size:30px;font-weight:600;color:#3b4460;line-height:1.45}

/* البديل يظهر بعد النقاش */
.dd .slot{position:relative;border:3px dashed #BFD9CB;border-radius:24px;display:flex;align-items:center;justify-content:center;min-height:100%}
.dd .slot .q{font-size:34px;font-weight:800;color:#8FB5A2}
.dd .slot .c.v{position:absolute;inset:-3px}
.dd .r .ar{opacity:0;transition:opacity .4s} .dd .r:has(.c.v.in) .ar{opacity:1}

/* أدوات التحكم */
#progress{position:fixed;top:0;right:0;height:5px;background:linear-gradient(90deg,var(--gold-dark),var(--gold-light));transition:width .3s;z-index:5}
#bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:rgba(10,18,48,.86);
  border:1px solid rgba(217,174,75,.35);padding:10px 14px;border-radius:999px;z-index:5;transition:opacity .4s;backdrop-filter:blur(8px)}
#bar.hide{opacity:0;pointer-events:none}
#bar button{font-family:inherit;font-size:16px;font-weight:700;color:#fff;background:rgba(255,255,255,.08);border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
#bar button:hover{background:rgba(217,174,75,.3)}
#bar .cnt{color:var(--gold-light);font-weight:800;font-size:16px;padding:0 8px;min-width:80px;text-align:center}
#menu{position:fixed;inset:0;background:rgba(5,10,28,.94);z-index:10;display:none;padding:60px;overflow:auto}
#menu.open{display:block}
#menu h3{color:var(--gold);font-size:28px;margin-bottom:24px}
#menu .mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
#menu button{font-family:inherit;text-align:right;background:rgba(255,255,255,.06);border:1px solid rgba(217,174,75,.3);color:#fff;border-radius:18px;padding:20px;font-size:20px;font-weight:700;cursor:pointer}
#menu button small{display:block;color:#aab2cf;font-size:15px;margin-top:6px}
#menu button.cur{border-color:var(--gold);background:rgba(217,174,75,.18)}
</style>
</head>
<body>
<div id="progress"></div>
<div id="viewport"><div id="stage"></div></div>
<div id="bar">
  <button onclick="location.href='../index.html'" title="العودة لمنصة جذور">🌳 جذور</button>
  <button onclick="toggleMenu()" title="المحاور (M)">☰ المحاور</button>
  <button onclick="prev()" title="السابق">→</button>
  <span class="cnt" id="cnt"></span>
  <button onclick="next()" title="التالي">←</button>
  <button onclick="fullscreen()" title="ملء الشاشة (F)">⛶ ملء الشاشة</button>
</div>
<div id="menu"><h3>محاور الدورة</h3><div class="mods" id="mods"></div></div>

<script src="content.js"></script>
<script>MAWAQIF.parts.forEach(p => document.write('<script src="parts/' + p + '.js"><\/script>'));</script>
<script>
/* ========== تجهيز قائمة الشرائح ========== */
const C = window.MAWAQIF;
const SLIDES = [];                       // كل شرائح الدورة بالترتيب
C.modules.forEach((m, mi) => m.slides.forEach(s => SLIDES.push({ ...s, mi })));
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);   // أرقام عربية
const LETTERS = ['أ', 'ب', 'ج', 'د', 'هـ'];
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

let cur = 0, step = 0;                   // الشريحة الحالية، وعدد العناصر الظاهرة فيها

/* الشرائح الداكنة: العناوين والنصوص الشرعية؛ والباقي فاتح */
const DARK = ['cover','section','hadith','ayah','statement','prophet','activity','mcover','end'];

/* ========== رسم كل نوع من الشرائح ========== */
const R = {
  cover: () => `<div class="slide dark cover">
      <div class="logo">🌳</div>
      <div class="tag">${C.tag}</div>
      <h1>${C.title}</h1>
      <div class="subt">${C.subtitle}</div>
      <div class="goldline"></div>
      <div class="by">إعداد وتقديم: <b>${C.author}</b></div></div>`,

  bio: s => `<div class="slide light">
      <div class="kicker">مقدّم الدورة</div>
      <h2 class="title" style="margin-bottom:12px">${s.name}</h2>
      <div class="sub" style="margin-top:0;color:var(--navy-600)">${s.role}</div>
      <div class="cards" style="grid-template-columns:repeat(3,1fr)">
        ${s.facts.map(f => `<div class="card f" style="align-items:center;text-align:center;padding:60px 30px">
          <div style="font-size:${/\d|[٠-٩]/.test(f.big)?110:68}px;font-weight:900;color:var(--gold-dark);line-height:1.2;direction:ltr">${f.big}</div>
          <p style="font-size:40px;font-weight:800;color:var(--navy-800)">${f.small}</p></div>`).join('')}
      </div>
      <div class="f" style="text-align:center;font-size:36px;font-weight:700;color:var(--muted);margin-top:30px">${s.line}</div></div>`,

  cards: s => `<div class="slide light">
      ${s.kicker ? `<div class="kicker">${s.kicker}</div>` : ''}
      <h2 class="title">${s.title}</h2>
      <div class="cards" style="grid-template-columns:repeat(${s.cols || s.cards.length},1fr);${s.cols ? 'gap:28px' : ''}">
        ${s.cards.map(c => `<div class="card f" ${s.cols ? 'style="padding:30px 34px;gap:10px"' : ''}><div class="ic" ${s.cols ? 'style="width:84px;height:84px;font-size:48px"' : ''}>${c.icon}</div><h3 ${s.cols ? 'style="font-size:40px"' : ''}>${c.h}</h3><p ${s.cols ? 'style="font-size:32px"' : ''}>${c.b}</p></div>`).join('')}
      </div></div>`,

  section: s => `<div class="slide dark section">
      <div class="num">${s.num}</div>
      <div class="lbl">المحطة ${s.num}</div>
      <h2>${s.title}</h2><p>${s.sub}</p></div>`,

  hadith: s => `<div class="slide dark center">
      <div class="kicker">${s.kicker}</div>
      <div class="hadith-box"><div class="naskh">${s.text}</div></div>
      <div class="src f">${s.src}</div></div>`,

  ayah: s => `<div class="slide dark center">
      <div class="kicker">قال تعالى</div>
      <div class="ayah"><span class="br">﴿</span> ${s.text} <span class="br">﴾</span></div>
      <div class="src">${s.src}</div></div>`,

  statement: s => `<div class="slide dark center">
      <div class="kicker">${s.kicker}</div>
      <div class="statement ${s.src ? 'naskh' : ''}" ${s.src ? 'style="font-size:88px"' : ''}>${s.text.replace(/…/, '…<br><span class="hl">') + (s.text.includes('…') ? '</span>' : '')}</div>
      ${s.src ? `<div class="src">${s.src}</div>` : ''}</div>`,

  script: s => `<div class="slide light">
      <div class="kicker">${s.kicker}</div>
      <h2 class="title">${s.title}</h2>
      <div class="lines">
        ${s.lines.map(l => `<div class="line f"><div class="who">${l.who}</div>
          <div class="bubble ${l.say.length > 55 ? 'long' : ''}"><span class="q">«</span>${l.say}<span class="q">»</span></div></div>`).join('')}
      </div>
      ${s.warn ? `<div class="warn f">⚠️ ${s.warn}</div>` : ''}</div>`,

  activity: s => `<div class="slide dark">
      <div class="kicker">${s.kicker}</div>
      <h2 class="title" style="color:var(--gold-light)">${s.title}</h2>
      <div class="activity">
        <div class="steps">${s.steps.map((t, i) => `<div class="step f"><div class="n">${AR(i + 1)}</div><div>${t}</div></div>`).join('')}</div>
        <div class="timer" id="timer" data-sec="${s.timer}" onclick="event.stopPropagation();startTimer(this)">
          <div class="t">${fmt(s.timer)}</div><div class="h">اضغط لبدء المؤقت</div></div>
      </div></div>`,

  prophet: s => `<div class="slide dark">
      <div class="kicker">${s.kicker}</div>
      <h2 class="title">${s.title}</h2>
      <div class="prophet">
        <div><div class="story">${s.story}</div>
          <div class="pq f">«${s.quote}»<small>${s.src}</small></div></div>
        <div class="lessons f"><h4>كيف تصرّف ﷺ؟</h4>
          ${s.lessons.map((l, i) => `<div class="l"><i>${AR(i + 1)}</i><div>${l}</div></div>`).join('')}</div>
      </div></div>`,

  puzzle: s => `<div class="slide light">
      <div class="kicker">${s.kicker}</div>
      <h2 class="title" style="margin-bottom:30px">${s.title}</h2>
      <div class="pz" id="pz"><div class="words">${s.words.map(w => `<span class="word">${w}</span>`).join('')}</div>
      <div class="ptext">${s.text.replace(/____/g, '<span class="blank"></span>')}</div>
      <div class="answer"><b>الحل:</b> ${s.answer}</div></div><i class="f" data-reveal="pz"></i></div>`,

  vote: s => `<div class="slide light">
      <div class="kicker">${s.kicker}</div>
      <h2 class="title">${s.title}</h2>
      <div class="opts ${s.options.length > 3 ? 'compact' : ''}" id="opts">
        ${s.options.map((o, i) => `<div class="opt ${i === s.correct ? 'ok' : ''}"><div class="L">${LETTERS[i]}</div>
          <div class="tx">${o}${s.why ? `<div class="w">${s.why[i]}</div>` : ''}</div></div>`).join('')}
      </div><i class="f" data-reveal="opts"></i></div>`,

  chart: s => {
    const max = 100;
    return `<div class="slide light">
      <div class="kicker">${s.kicker}</div>
      <h2 class="title" style="margin-bottom:30px">${s.title}</h2>
      <div class="chart" id="chart">
        ${s.bars.map(b => `<div class="bar ${b.tone}"><div class="v">${AR(b.v)}</div><div class="col" data-h="${b.v / max * 100}%"></div></div>`).join('')}
      </div>
      <div class="blabels">${s.bars.map(b => `<div>${b.label}</div>`).join('')}</div>
      <div class="chart-src">المحور الرأسي: ${s.unit} · المصدر: ${s.src}</div></div>`;
  },

  map: s => `<div class="slide light">
      <div class="kicker">${s.kicker}</div>
      <h2 class="title" style="margin-bottom:24px">${s.title}</h2>
      <div class="map">${s.stops.map((p, i) => `<div class="stop"><div class="i">${p.icon}</div>
        <div><div class="no">المحطة ${AR(i + 1)}</div><div class="nm">${p.name}</div></div></div>`).join('')}</div></div>`,

  mcover: s => `<div class="slide dark mcover">
      ${s.img ? `<div class="bgimg kb"><img src="${s.img}" alt=""></div>` : `<div class="big">${s.icon}</div>`}
      <div class="cat">${s.cat}</div>
      <div class="lbl">الموقف ${s.num}</div>
      <h2>${s.title}</h2>
      <div class="flow"><span>🎬 القصة</span><span>🗳️ تصويت</span><span>🔍 لماذا؟</span><span>⏱️ أول ١٠ ثوانٍ</span><span>💬 ماذا تقول؟</span><span>🪜 سلّم التدخّل</span></div></div>`,

  story: s => {
    const paras = `<div class="story-wrap">${s.paras.map((p, i) => `<div class="para f ${i === s.paras.length - 1 ? 'last' : ''}">${p}</div>`).join('')}</div>`;
    return `<div class="slide light">
      <div class="kicker">🎬 القصة</div>
      <h2 class="title" style="margin-bottom:20px">${s.title}</h2>
      ${s.img ? `<div class="story-grid">${paras}<div class="scene kb"><img src="${s.img}" alt=""></div></div>` : paras}</div>`;
  },

  why: s => `<div class="slide light">
      <div class="kicker">🔍 ${s.sub}</div>
      <h2 class="title">${s.title}</h2>
      <div class="why-grid" style="grid-template-columns:repeat(${s.causes.length},1fr)">${s.causes.map(c => `<div class="card f"><div class="ic">${c.icon}</div><h3>${c.h}</h3><p>${c.b}</p></div>`).join('')}</div>
      <div class="key f">💡 ${s.key.replace('…', '…<br><b>') + '</b>'}</div></div>`,

  first10: s => `<div class="slide light">
      <div class="kicker">⏱️ ${s.sub}</div>
      <div class="clock">⏱ ${s.clock || '١٠ ثوانٍ'}</div>
      <h2 class="title">${s.title}</h2>
      <div class="f10">${s.steps.map((x, i) => `<div class="s f"><div class="n">${AR(i + 1)}</div><h3>${x.h}</h3><p>${x.b}</p></div>`).join('')}</div></div>`,

  ladder: s => {
    const cols = ['#2E9E6B', '#5A9E4B', '#B7A034', '#D99A2B', '#D9722B', '#C94040'];
    return `<div class="slide light">
      <div class="kicker">🪜 ${s.sub}</div>
      <h2 class="title" style="margin-bottom:24px">${s.title}</h2>
      <div class="ladder">${s.steps.map((t, i) => `<div class="rung f" style="background:${cols[i]};margin-right:${i * 70}px">
        <div class="n">${AR(i + 1)}</div><div>${t}</div></div>`).join('')}</div></div>`;
  },

  dodont: s => `<div class="slide light">
      <h2 class="title" style="margin-bottom:24px">${s.title}</h2>
      <div class="dd"><div class="hd"><div class="x">❌ الخطأ الشائع</div><div></div><div class="v">✅ البديل</div></div>
        ${s.rows.map(r => `<div class="r"><div class="c x f">${r[0]}</div><div class="ar">←</div>
          <div class="slot"><span class="q">💬 ناقشوا… ما البديل؟</span><div class="c v f">${r[1]}</div></div></div>`).join('')}</div></div>`,
};

Object.assign(R, {
  myth: s => `<div class="slide light">
      <div class="kicker">صح أم خطأ؟ ${s.n ? '· ' + AR(s.n) + ' من ' + AR(s.of) : ''}</div>
      <div class="myth">
        <div class="claim">${s.text}</div>
        <div class="stamp f">✗ خطأ</div>
        <div class="fix f"><b>الصحيح: </b>${s.fix}</div>
      </div></div>`,

  table: s => {
    const cols = s.widths || s.head.map(() => '1fr');
    const gt = `grid-template-columns:${cols.join(' ')}`;
    return `<div class="slide light">
      ${s.kicker ? `<div class="kicker">${s.kicker}</div>` : ''}
      <h2 class="title" style="margin-bottom:24px">${s.title}</h2>
      <div class="tbl"><div class="tr" style="${gt}">${s.head.map(h => `<div class="th">${h}</div>`).join('')}</div>
        ${s.rows.map(r => `<div class="tr f" style="${gt}">${r.map(c => `<div class="td">${c}</div>`).join('')}</div>`).join('')}</div></div>`;
  },

  quad: s => `<div class="slide light">
      <div class="kicker">${s.kicker}</div>
      <h2 class="title" style="margin-bottom:24px">${s.title}</h2>
      <div class="quad">
        <div class="ax v">${s.yHigh}</div>${s.cells.slice(0, 2).map(c => quadCell(c)).join('')}
        <div class="ax v">${s.yLow}</div>${s.cells.slice(2).map(c => quadCell(c)).join('')}
        <div></div><div class="ax">${s.xRight}</div><div class="ax">${s.xLeft}</div>
      </div></div>`,

  numlist: s => `<div class="slide light">
      ${s.kicker ? `<div class="kicker">${s.kicker}</div>` : ''}
      <h2 class="title" style="margin-bottom:24px">${s.title}</h2>
      <div class="numlist ${s.items.length > 4 ? 'compact' : ''}">${s.items.map((it, i) => `<div class="it f"><div class="n">${AR(i + 1)}</div>
        <div><h3>${it.h}</h3>${it.b ? `<p>${it.b}</p>` : ''}</div></div>`).join('')}</div></div>`,

  end: s => `<div class="slide dark cover">
      <div class="logo">🌳</div>
      <h1 style="font-size:150px">${s.title}</h1>
      <div class="subt">${s.sub}</div>
      <div class="goldline"></div>
      <div class="by">${C.title} · إعداد وتقديم: <b>${C.author}</b></div></div>`,
});
function quadCell(c) {
  return `<div class="cell f ${c.best ? 'best' : ''}"><div class="ci">${c.icon}</div><h3>${c.name}</h3><p>${c.desc}</p></div>`;
}

function fmt(sec) { return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; }

/* ========== العرض والتنقل ========== */
function footer(s) {
  if (s.t === 'cover') return '';
  return `<div class="foot"><div class="brand">🌳 <b>جذور</b> · ${C.title}</div><div class="sp"></div>
    <div>${C.modules[s.mi].name}</div><div>·</div><div>${AR(cur + 1)}</div></div>`;
}
function render() {
  const s = SLIDES[cur];
  const stage = document.getElementById('stage');
  stage.innerHTML = R[s.t](s);
  const sl = stage.firstElementChild;
  sl.querySelectorAll('h2.title').forEach(h => { if (h.textContent.length > 32) h.classList.add('long'); });
  sl.classList.add('enter');
  sl.insertAdjacentHTML('beforeend', footer(s));
  step = 0;
  applySteps();
  // الرسم البياني يرتفع تلقائيًا
  if (s.t === 'chart') setTimeout(() => stage.querySelectorAll('.col').forEach((c, i) =>
    setTimeout(() => c.style.height = c.dataset.h, i * 180)), 250);
  document.getElementById('cnt').textContent = `${AR(cur + 1)} / ${AR(SLIDES.length)}`;
  document.getElementById('progress').style.width = ((cur + 1) / SLIDES.length * 100) + '%';
  if (location.hash !== '#' + (cur + 1)) history.replaceState(null, '', '#' + (cur + 1));
}
function frags() { return [...document.querySelectorAll('#stage .f')]; }
function applySteps() {
  frags().forEach((el, i) => {
    const on = i < step;
    el.classList.toggle('in', on);
    if (el.dataset.reveal) document.getElementById(el.dataset.reveal).classList.toggle('revealed', on);
  });
}
function next() {
  if (step < frags().length) { step++; applySteps(); return; }
  if (cur < SLIDES.length - 1) { cur++; render(); }
}
function prev() {
  if (step > 0) { step--; applySteps(); return; }
  if (cur > 0) { cur--; render(); step = frags().length; applySteps(); }
}
function goTo(i) { cur = Math.max(0, Math.min(SLIDES.length - 1, i)); render(); toggleMenu(false); }

/* مؤقت النشاط */
let tmr = null;
function startTimer(el) {
  clearInterval(tmr);
  let left = +el.dataset.sec;
  el.classList.remove('done'); el.classList.add('run');
  el.querySelector('.h').textContent = 'الوقت المتبقي';
  tmr = setInterval(() => {
    left--; el.querySelector('.t').textContent = fmt(Math.max(0, left));
    if (left <= 0) { clearInterval(tmr); el.classList.replace('run', 'done'); el.querySelector('.h').textContent = 'انتهى الوقت ✓'; }
  }, 1000);
}

/* قائمة المحاور */
function toggleMenu(force) {
  const m = document.getElementById('menu');
  const open = force ?? !m.classList.contains('open');
  if (open) {
    let idx = 0;
    document.getElementById('mods').innerHTML = C.modules.map((mod, mi) => {
      const first = idx; idx += mod.slides.length;
      return `<button class="${SLIDES[cur].mi === mi ? 'cur' : ''}" onclick="goTo(${first})">${mod.name}<small>${AR(mod.slides.length)} شريحة</small></button>`;
    }).join('');
  }
  m.classList.toggle('open', open);
}
function fullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}

/* تكبير المسرح ليملأ الشاشة مع الحفاظ على نسبة 16:9 */
function fit() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  document.getElementById('stage').style.transform = `scale(${k})`;
}
addEventListener('resize', fit);

/* لوحة المفاتيح: نفس أزرار البوربوينت وأجهزة التحكم عن بعد */
addEventListener('keydown', e => {
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === 'f' || e.key === 'F' || e.key === 'ف') fullscreen();
  else if (e.key === 'm' || e.key === 'M' || e.key === 'ة') toggleMenu();
  else if (e.key === 'Escape') toggleMenu(false);
  else if (e.key === 'Home') goTo(0);
  else if (e.key === 'End') goTo(SLIDES.length - 1);
});
/* النقر على الشريحة = التالي */
document.getElementById('viewport').addEventListener('click', e => { if (!e.target.closest('#bar')) next(); });

/* إخفاء شريط التحكم تلقائيًا أثناء العرض */
let hideT;
function showBar() { const b = document.getElementById('bar'); b.classList.remove('hide'); clearTimeout(hideT); hideT = setTimeout(() => b.classList.add('hide'), 2500); }
addEventListener('mousemove', showBar);

/* البداية: من رقم الشريحة في الرابط (مثل ‎#12) أو من الغلاف */
(function start() {
  const h = parseInt(location.hash.slice(1));
  cur = Math.max(0, Math.min(SLIDES.length - 1, h ? h - 1 : 0));
  fit(); render(); showBar();
})();
</script>
</body>
